services:
  drover-web:
    build: .
    restart: unless-stopped
    networks:
      - traefik-public
    labels:
      logging: "promtail"
      traefik.enable: "true"
      traefik.http.routers.drover-web.rule: "Host(`${DROVER_WEB_DOMAIN:?set DROVER_WEB_DOMAIN in .env}`)"
      traefik.http.routers.drover-web.entrypoints: "https"
      traefik.http.routers.drover-web.tls.certresolver: "le"

networks:
  traefik-public:
    external: true
