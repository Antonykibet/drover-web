server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, absolute redirects would be rebuilt as http:// from the
    # Host header. Relative Location headers keep the scheme the client used.
    absolute_redirect off;

    location /shots/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # One-page site: unknown paths are a real 404, not the home page with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css text/html application/javascript image/svg+xml;
}
