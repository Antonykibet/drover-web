name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The page references its images by relative path; a renamed or missing
      # file would deploy as a broken image with nothing else looking wrong.
      - name: Check referenced assets exist
        run: |
          set -euo pipefail
          test -s index.html
          for f in $(grep -oE 'src="shots/[^"]+"' index.html | sed -E 's/^src="|"$//g' | sort -u); do
            test -s "$f" || { echo "referenced but missing: $f"; exit 1; }
          done
          echo "assets ok"

      - name: Build image
        run: docker build -t drover-web:ci .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name drover-web-ci -p 8080:80 drover-web:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8080/ | grep -q 'id="wl-form"'
          curl -fsI http://127.0.0.1:8080/shots/principal.jpg | grep -qi 'content-type: image/jpeg'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404
          echo "smoke ok"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-drover-web
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # The VM forces this key to run drover-web-deploy (pull, build, restart,
          # wait for healthy) whatever is sent, so this line is only a label.
          script: drover-web-deploy
